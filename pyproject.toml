[project]
name = "tailscale-api"
version = "2026.0"
description = "Tools for working with the Tailscale API"
readme = "PYPI_README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
]

[[project.authors]]
name = "William Jackson"
email = "william@subtlecoolness.com"

[project.urls]
"Homepage" = "https://github.com/williamjacksn/tailscale-api"
"Issues" = "https://github.com/williamjacksn/tailscale-api/issues"

[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.13.5,<0.14.0"]

[dependency-groups]
dev = [
    "pypi-attestations>=0.0.30",
    "ruff>=0.17.1",
    "ty>=0.0.90",
    "uv-build>=0.13.5",
]

[tool.ruff.lint]
extend-select = ["ANN", "DTZ", "E", "F", "FURB", "I", "ICN", "PERF", "Q", "RSE", "RUF", "S", "UP"]
